<!DOCTYPE html>
<html lang="ko">
<head>

    <script src="./script/head-common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- 페이지 레이아웃 -->
    <script src="./script/header.js"></script>
    <script src="./script/include.js"></script>
    <link rel="stylesheet" href="./style/index.css">
    <script src="./script/index.js" defer></script>
    
    
</head>
<body>
    <div id="include-header"></div>
    
    <!-- 전체 컨텐츠 -->
    <main>
        <!-- 히어로배너 -->
        <!-- Slider main container -->
        <div class="swiper hero-slider">
        <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
                <!-- Slides -->
                <div class="swiper-slide">
                    <img src="./img/hero-banner/slider1-pc.jpg" alt="아뜰리에1920" class="pc">
                    <img src="./img/hero-banner/slider1-tab.jpg" alt="아뜰리에1920" class="tab">
                    <img src="./img/hero-banner/slider1-mo.jpg" alt="아뜰리에1920" class="mo">
                </div>
                <div class="swiper-slide">
                    <img src="./img/hero-banner/slider2-pc.jpg" alt="시에나37" class="pc">
                    <img src="./img/hero-banner/slider2-tab.jpg" alt="시에나37" class="tab">
                    <img src="./img/hero-banner/slider2-mo.jpg" alt="시에나37" class="mo">
                </div>
                <div class="swiper-slide">
                    <img src="./img/hero-banner/slider3-pc.jpg" alt="데일리런던" class="pc">
                    <img src="./img/hero-banner/slider3-tab.jpg" alt="데일리런던" class="tab">
                    <img src="./img/hero-banner/slider3-mo.jpg" alt="데일리런던" class="mo">
                </div>
            </div>
            <div class="pagination"></div>
        </div>

        <div class="quick">
            <div class="quick-women quick-item">
                <figure>
                    <a href="#">
                        <img src="./img/main-page/women.jpg" alt="sienna 37">
                        <h1>sienna 37</h1>
                    </a>
                </figure>
            </div>
            <div class="quick-men quick-item">
                <figure>
                    <a href="#">
                        <img src="./img/main-page/men.jpg" alt="RAW 56">
                        <h1>RAW 56</h1>
                    </a>
                </figure>
            </div>
        </div>

        <div class="best-seller">
            <h1>BEST SELLERS</h1>
            <div class="swiper lookbook-swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-1.jpg" alt="sienna 37">
                        <h2>sienna 37</h2>
                        <p>195,000원</p>
                    </div>
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-2.jpg" alt="Essential Leather Bit Loafers">
                        <h2>Essential Leather Bit Loafers</h2>
                        <p>215,000원</p>
                    </div>
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-3.jpg" alt="Adela">
                        <h2>Adela</h2>
                        <p>212,000</p>
                    </div>
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-4.jpg" alt="Verdant">
                        <h2>Verdant</h2>
                        <p>188,000</p>
                    </div>
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-5.jpg" alt="Mono Stiletto">
                        <h2>Mono Stiletto</h2>
                        <p>208,000</p>
                    </div>
                    <div class="swiper-slide">
                        <img src="./img/main-page/best/best-6.jpg" alt="Atic">
                        <h2>Atic</h2>
                        <p>221,000</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="style-board">
            <h1>STYLE BOARD</h1>
            <div class="style-grid">
                <figure>
                    <img src="./img/style-board/style-1.jpg" alt="The Meridian">
                    <p>sienna 37</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-2.jpg" alt="The Meridian">
                    <p>sienna 37</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-3.jpg" alt="The Meridian">
                    <p>Serena Pumps</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-4.jpg" alt="The Meridian">
                    <p>Urban Edge</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-5.jpg" alt="The Meridian">
                    <p>Velua</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-6.jpg" alt="The Meridian">
                    <p>Adela</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-7.jpg" alt="The Meridian">
                    <p>Lumiere</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-8.jpg" alt="The Meridian">
                    <p>Mono Verdant</p>
                </figure>
                <figure>
                    <img src="./img/style-board/style-9.jpg" alt="The Meridian">
                    <p>Neutral Edition</p>
                </figure>
            </div>
            <div class="common-frame">
                <button>
                    <p>MORE</p>
                </button>
            </div>
        </div>

        <script>
            const heroSwiper = new Swiper('.hero-slider', {
            // Optional parameters
            // direction: 'vertical',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.swiper-scrollbar',
            },
            });
        </script>

    </main>

    <div id="include-footer"></div>
    
</body>
</html>
